name: FinPilot 2.0 CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify KMP Platform Targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Backend Gateway
        run: |
          cd backend
          npm install
          npm run build

      - name: Make Gradlew Executable
        run: chmod +x FinPilot/gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run Multiplatform Tests
        run: ./FinPilot/gradlew test --stacktrace

      - name: Build Web Production Webpack
        run: ./FinPilot/gradlew :webApp:jsBrowserProductionWebpack

      - name: Build Android Release APK
        run: ./FinPilot/gradlew :androidApp:assembleRelease
